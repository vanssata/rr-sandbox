# Generated by `rr sync`.
name: rr-verify
on:
  pull_request:
  schedule:
    - cron: "17 2 * * *"
permissions:
  contents: read
jobs:
  rr-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0, persist-credentials: false } # the policy in force is read from origin/<default branch>
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with: { go-version: "1.27.3" }
      - run: go install github.com/vanssata/agentic-risk-rails/cmd/rr@v0.4.3
        working-directory: ${{ runner.temp }}
      - run: rr sync --check
      - run: rr verify --full
